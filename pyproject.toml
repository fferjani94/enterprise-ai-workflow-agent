[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
[project]
name = "enterprise-ai-workflow-agent"
dynamic = ["version"]
description = "Approval-gated enterprise AI workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4", "mcp>=1.10,<2", "langgraph>=0.6,<2", "langchain-core>=0.3,<2",
  "httpx>=0.27,<1",
]
[project.optional-dependencies]
agent = ["langchain-ollama>=0.3,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]
[tool.hatch.version]
path = "src/enterprise_ai_workflow_agent/__init__.py"
[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_ai_workflow_agent"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
